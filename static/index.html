<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Корпоративная система обучения</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="courses.css">
</head>
<body>
    <!-- header with logo/color accent -->
    <header class="site-header">
        <h1 class="logo">
            🎓 <span class="logo-text">LMS</span>
        </h1>
    </header>

    <div class="main-wrapper">
        <div class="form-panel">
            <div class="login-container">
                    <div class="logo">
                    <h1>🎓 LMS</h1>
                    <p>Корпоративная система обучения</p>
                </div>

                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>

                <!-- form tabs -->
                <div class="form-tabs">
                    <button id="tab-login" class="form-tab active">Вход</button>
                    <button id="tab-register" class="form-tab">Регистрация</button>
                </div>

                <!-- Login Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label for="login">Логин</label>
                        <input type="text" id="login" name="login" required autocomplete="username">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    
                    <button type="submit" class="btn pulse">Войти в систему</button>
                </form>

                <!-- Registration Form (hidden by default) -->
                <form id="register-form" class="register-form">
                    <div class="register-header">
                        <h2>Создать аккаунт</h2>
                        <p>Откройте доступ к курсам и проходите обучение легко.</p>
                    </div>

                    <div class="form-group">
                        <label for="reg-fullname">ФИО</label>
                        <input type="text" id="reg-fullname" name="fullname" placeholder="Иван Иванов" autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="reg-email">E-mail</label>
                        <input type="email" id="reg-email" name="email" placeholder="example@mail.ru" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="reg-login">Логин</label>
                        <input type="text" id="reg-login" name="login" required autocomplete="username" placeholder="ivan123">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password">Пароль</label>
                        <input type="password" id="reg-password" name="password" required autocomplete="new-password" placeholder="••••••••">
                    </div>

                    <div class="form-group">
                        <label for="reg-password-confirm">Подтвердите пароль</label>
                        <input type="password" id="reg-password-confirm" name="password_confirm" required placeholder="••••••••" autocomplete="new-password">
                    </div>
                    
                    <button type="submit" class="btn btn-gradient">Зарегистрироваться</button>
                    <div class="note">Уже зарегистрированы? <span id="switch-to-login" class="link-style">Войти</span></div>
                </form>
            </div>
        </div>
        <div class="courses-panel">
            <div class="courses-section">
                <h3>🔥 Популярные курсы</h3>
                <div class="course-list" id="course-list">
                    <div class="loading">Загрузка курсов...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
